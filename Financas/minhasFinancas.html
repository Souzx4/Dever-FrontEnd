<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 60%;
            margin: auto;
        }

        caption {
            font-size: 1.2em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }

        td,
        th {
            border: 1px solid black;
            padding: 10px;
        }

        thead,
        tfoot {
            background-color: gray;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: lightgray;
        }

        .h1 {
            text-align: center;
        }

        .num {
            text-align: right;
        }
    </style>
</head>

<body>
    <button onclick="resetarDados()">Resetar dados salvos</button>
    <h1 class="h1">Finanças</h1>
    <!--
     anatomia para tabelas grandes
     table
        thead
            tr,td, th
        tbody
            tr,td, th
        tfoot
            tr,td, th
     -->
    <table>
        <thead>
            <caption>
                Minhas Finanças desde 2025
            </caption>
            <tr>
                <th>Clientes</th>
                <th>data</th>
                <th>Valor</th>
                <th>Juros</th>
                <th>Parcelamento</th>
                <th>Valor pago</th>
            </tr>
        </thead>
        <tbody>

            <tr>
                <td>nome</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <th colspan="5">Saldo Restante</th>
                <td class="num" id="res3"><strong>...</strong></td>
            </tr>
        </tfoot>
    </table>
    <div class="btn-container">
        <button onclick="adicionarLinha()">+ Adicionar Linha</button>
    </div>
    <script src="minhasFinancas.js"></script>
</body>

</html>
